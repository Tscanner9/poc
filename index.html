<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>JSAPI Signature PoC</title>
    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
</head>
<body>
<h1>JS-SDK Signature Test</h1>
<p>签名时使用的URL: <code id="signedUrl"></code></p>
<p>当前实际URL: <code id="currentUrl"></code></p>
<script>
    // 将你在请求接口时使用的 url 参数值硬编码在这里，方便肉眼比对
    const SIGNED_URL = "https://Tscanner9.github.io/poc/";
    document.getElementById('signedUrl').textContent = SIGNED_URL;
    document.getElementById('currentUrl').textContent = location.href.split('#')[0];

    wx.config({
        debug: true, // 必须开启，结果会以弹窗形式显示
        appId: 'wx274a8b4b49dba1e4',
        timestamp: 1795134468, // 数字，不加引号
        nonceStr: '2a850a46-9f0d-40bc-b11c-c7fe0e04e759',
        signature: 'da9adbe274c3dc9d8a0cc989e51723d924861df8',
        jsApiList: ['getLocation', 'chooseImage', 'scanQRCode']
    });

    wx.ready(function() {
        console.log('✅ wx.config 校验通过，签名在 GitHub Pages 域上生效');
        // 可选：进一步调用高危接口作为危害证明
        wx.getLocation({ type: 'wgs84', success: res => console.log(res) });
    });

    wx.error(function(res) {
        console.error('❌ wx.config 校验失败', res);
    });
</script>
</body>
</html>
